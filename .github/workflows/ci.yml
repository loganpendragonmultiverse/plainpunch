name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83" wheel
      - run: python -m pip install -e ".[dev]" pip-audit build
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: coverage run -m pytest
      - run: coverage report
      - run: python -m pip_audit --skip-editable
      - run: python -m build
