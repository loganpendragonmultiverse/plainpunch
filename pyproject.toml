[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "plainpunch"
version = "1.1.1"
description = "A small self-hosted time clock without surveillance."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = ["Flask>=3.1,<4", "gunicorn>=23,<27", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["coverage[toml]>=7.10", "mypy>=1.17", "pytest>=8.4", "ruff>=0.12", "types-Flask>=1.1"]

[project.scripts]
plainpunch = "plainpunch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plainpunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["plainpunch"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["plainpunch"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
disable_error_code = ["type-var"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "plainpunch/docs/README.md"
"CHANGELOG.md" = "plainpunch/docs/CHANGELOG.md"
"DEVELOPMENT.md" = "plainpunch/docs/DEVELOPMENT.md"
"TESTING.md" = "plainpunch/docs/TESTING.md"
"LICENSE" = "plainpunch/docs/LICENSE"

[tool.hatch.build.targets.sdist]
exclude = ["/.venv", "/.install", "/.forge-review", "/.forge-task.json", "/dist"]
